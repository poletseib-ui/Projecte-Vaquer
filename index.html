<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow" id="channelLabel">Control del cercado</p>
        <h1 id="appTitle">Dashboard</h1>
      </div>
      <button id="refreshButton" type="button">Actualizar</button>
    </header>

    <section id="status" class="status" aria-live="polite">Cargando datos...</section>

    <section class="last-reading" aria-label="Ultima lectura">
      <article class="card card-primary">
        <div class="last-reading-layout">
          <img class="cow-illustration" src="assets/cow.png" alt="">
          <div class="last-reading-content">
            <span>Tension actual del hilo</span>
            <strong id="lastValue">--</strong>
            <small id="lastTime">--</small>
          </div>
        </div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Ultimos 10 valores</h2>
          <p>Lecturas del hilo electrico representadas en kV</p>
        </div>
      </div>
      <div id="chart" class="chart" role="img" aria-label="Grafico de los ultimos 10 valores de tension del hilo"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Lecturas</h2>
          <p>Fecha y hora en horario local</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Fecha y hora</th>
              <th>Tension del hilo</th>
            </tr>
          </thead>
          <tbody id="readingsTable"></tbody>
        </table>
      </div>
    </section>

    <section class="site-editor" aria-label="Nombre del sitio">
      <label for="siteNameInput">Ubicacion del sensor</label>
      <div class="site-editor-row">
        <input id="siteNameInput" type="text" placeholder="Ejemplo: Zanja norte - Cerca vacas">
        <button id="saveSiteNameButton" type="button">Guardar nombre</button>
      </div>
      <small>El nombre se guarda en este dispositivo.</small>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
