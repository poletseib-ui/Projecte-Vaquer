<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow" id="channelLabel">Mas Serradell</p>
        <h1 id="appTitle">Dashboard</h1>
      </div>
      <button id="refreshButton" type="button">Actualitzar</button>
    </header>

    <section id="status" class="status" aria-live="polite">Carregant dades...</section>

    <section class="last-reading" aria-label="Ultima lectura">
      <article class="card card-primary">
        <div class="last-reading-layout">
          <img class="cow-illustration" src="cow.png" alt="">
          <div class="last-reading-content">
            <span>Tensio actual del fil</span>
            <strong id="lastValue">--</strong>
            <small id="lastTime">--</small>
          </div>
        </div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Ultimes 10 lectures</h2>
          <p>Lectures del fil electric representades en kV</p>
        </div>
      </div>
      <div id="chart" class="chart" role="img" aria-label="Grafic de les ultimes 10 lectures de tensio del fil"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>Lectures</h2>
          <p>Data i hora en horari local</p>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Data i hora</th>
              <th>Tensio del fil</th>
            </tr>
          </thead>
          <tbody id="readingsTable"></tbody>
        </table>
      </div>
    </section>

    <section class="site-editor" aria-label="Nom del lloc">
      <label for="siteNameInput">Ubicacio del sensor</label>
      <div class="site-editor-row">
        <input id="siteNameInput" type="text" placeholder="Exemple: Rasa nord - Vaques">
        <button id="saveSiteNameButton" type="button">Guardar nom</button>
      </div>
      <small>El nom es guarda en aquest dispositiu.</small>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
